[package]
name = "tiny-poly"
version = "0.1.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
categories = ["algorithms"]
edition = "2021"
keywords = ["tutorial"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sdiehl/tiny-poly"
description = "Polynomial functors as a category, with sum, parallel tensor, and composition"

[dependencies]

[dev-dependencies]
insta = "1.48"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "vending"
path = "examples/vending.rs"

[[example]]
name = "pipeline"
path = "examples/pipeline.rs"

[[example]]
name = "workflow"
path = "examples/workflow.rs"

[[example]]
name = "counter"
path = "examples/counter.rs"

[[example]]
name = "dfa"
path = "examples/dfa.rs"

[[example]]
name = "file_reader"
path = "examples/file_reader.rs"

[[example]]
name = "square"
path = "examples/square.rs"

[[example]]
name = "streams"
path = "examples/streams.rs"

[[example]]
name = "arrow_field"
path = "examples/arrow_field.rs"

[[example]]
name = "life"
path = "examples/life.rs"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
